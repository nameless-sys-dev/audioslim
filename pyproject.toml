[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslim"
version = "0.1.0"
description = "A lightweight Python audio manipulation library with a custom bundled FFmpeg."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Alexander P. Scott", email = "apscott63@aol.com"}
]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slim_audio = ["bin/*"]