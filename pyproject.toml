[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "audioslim"
version = "0.1.0"
description = "Small audio manipulation library with a bundled audio-only FFmpeg"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
audioslim = [
    "_bin/ffmpeg",
    "_bin/ffmpeg.exe",
    "_licenses/*",
]